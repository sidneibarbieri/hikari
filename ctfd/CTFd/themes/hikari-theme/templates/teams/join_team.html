{% extends "base.html" %}

{% block content %}
  <div class="jumbotron hikari-page-hero">
    <div class="container">
      <h1>Entrar em equipe</h1>
      <p class="hikari-page-hero-copy">Localize a equipe e envie uma solicitação para aprovação do capitão.</p>
    </div>
  </div>
  <div class="container">
    <div class="row">
      <div class="col-md-8 col-lg-6 offset-md-2 offset-lg-3">
        <section class="hikari-guide">
          <h2>Solicitação de entrada</h2>
          <p>O capitão confirma cada novo integrante. Isso impede que alguém entre em uma equipe sem autorização.</p>
          <a class="btn btn-primary" href="{{ url_for('hikariplugin.hikari_team_directory') }}">Ver equipes disponíveis</a>
        </section>
      </div>
    </div>
  </div>
{% endblock %}
