{% extends "base.html" %}

{% block content %}
  <div class="jbig-header">
    <div class="container">
      <h1>Equipe</h1>
    </div>
  </div>
  <div class="container">
    <div class="team-join-panel">
      <h2>Entrar na competição</h2>
      <p>
        Para participar dos desafios, entre em uma equipe existente ou crie uma
        nova. Uma equipe pode ter somente você ou incluir outros competidores.
      </p>

      <div class="team-join-actions">
        <a class="btn btn-primary" href="{{ url_for('hikariplugin.hikari_team_directory') }}">Encontrar equipe</a>
        <a class="btn btn-primary" href="{{ url_for('teams.new') }}">Criar equipe, inclusive individual</a>
      </div>
    </div>
  </div>
{% endblock %}
