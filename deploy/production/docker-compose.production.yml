# =============================================================================
# Hikari Platform — Docker Compose de Produção
# Sobrescreve apenas o que difere do docker-compose.yml de desenvolvimento:
# restart policies, portas não expostas externamente, volumes nomeados,
# e variáveis sensíveis injetadas pelo setup_production.sh.
# Uso: docker compose -f ../local/docker-compose.yml \
#   -f docker-compose.production.yml --env-file .compose.env up -d
# =============================================================================

services:
  ctfd:
    restart: unless-stopped
    # Em produção, o CTFd escuta apenas em localhost (Nginx faz o proxy SSL)
    ports: !override
      - "127.0.0.1:${CTFD_PORT:-8000}:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      DATABASE_URL: "mysql+pymysql://ctfd:${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}@db/ctfd"
      REDIS_URL: "redis://cache:6379"
      SERVER_PUBLICBASEURL: "https://${HIKARI_DOMAIN}/hikari/kibana"
      HIKARI_GOOGLE_CLIENT_ID: "${HIKARI_GOOGLE_CLIENT_ID:-}"
      HIKARI_GOOGLE_CLIENT_SECRET: "${HIKARI_GOOGLE_CLIENT_SECRET:-}"
      HIKARI_OAUTH_REDIRECT_BASE: "https://${HIKARI_DOMAIN}"
      MAILFROM_ADDR: "${MAILFROM_ADDR:-noreply@localhost}"
      MAIL_SERVER: "${MAIL_SERVER:-}"
      MAIL_PORT: "${MAIL_PORT:-}"
      MAIL_USEAUTH: "${MAIL_USEAUTH:-false}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_TLS: "${MAIL_TLS:-false}"
      MAIL_SSL: "${MAIL_SSL:-false}"
      WORKERS: "${CTFD_WORKERS:-4}"
      HIKARI_TIME_ZONE: "${HIKARI_TIME_ZONE:-America/Sao_Paulo}"
      UPDATE_CHECK: "false"

  db:
    restart: unless-stopped
    # MariaDB nunca exposto publicamente em produção
    ports: []
    environment:
      MARIADB_ROOT_PASSWORD: "${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}"
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: "${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}"
      MARIADB_DATABASE: ctfd

  cache:
    restart: unless-stopped

  kafka:
    restart: unless-stopped

  elasticsearch:
    restart: unless-stopped
    # Elasticsearch nunca exposto publicamente em produção
    ports: []
    environment:
      KIBANA_ENCRYPTION_KEY: "${KIBANA_ENCRYPTION_KEY}"
      ES_ENCRYPTION_KEY: "${ES_ENCRYPTION_KEY}"
      path.repo: /usr/share/elasticsearch/snapshots
    volumes:
      - "${HIKARI_BACKUP_DIR:-/opt/hikari/backups}/elasticsearch:/usr/share/elasticsearch/snapshots"
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana:
    restart: unless-stopped
    # Kibana acessado apenas via proxy CTFd — nunca exposto diretamente
    environment:
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "${KIBANA_ENCRYPTION_KEY}"

  logstash:
    restart: unless-stopped

  mailcatcher:
    profiles: [development]
    ports: []
